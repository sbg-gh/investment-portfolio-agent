name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: portfolio-agent demo
      - run: portfolio-agent eval
      - run: portfolio-agent eval-valuation
  # The job above stays extra-free to prove the zero-dependency gates. This one adds the ui extra
  # (real-loopback server tests stop skipping) and the Node 18 frontend gates.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18.20.2'
      - run: python -m pip install --require-hashes -r requirements/ui.lock
      - run: python -m pip install --no-deps -e .
      - run: npm --prefix ui ci
      - run: npm --prefix ui run lint
      - run: npm --prefix ui test
      - run: npm --prefix ui run build
      - run: npm --prefix ui audit --omit=dev
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m portfolio_agent.cli eval
        env:
          PYTHONPATH: src
