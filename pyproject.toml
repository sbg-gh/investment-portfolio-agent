[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-portfolio-agent"
version = "0.3.0"
description = "Local-first, scoped portfolio agent foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
portfolio-agent = "portfolio_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portfolio_agent = ["eval_cases.json", "valuation_cases.json", "import_cases.json"]
